plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.floatapps'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.floatapps"
        minSdk 26
        targetSdk 34
        versionCode 9
        versionName "1.8"
    }

    buildTypes {
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
